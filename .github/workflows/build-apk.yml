name: FOTONMAP APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android 34 paketleri
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Debug APK derle
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK adini duzenle
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FOTONMAP-Hat-Secici-v0.5.1-debug.apk

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: FOTONMAP-Hat-Secici-v0.5.1
          path: dist/FOTONMAP-Hat-Secici-v0.5.1-debug.apk
